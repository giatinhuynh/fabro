<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" aria-labelledby="title desc" role="img" viewBox="0 0 1120 480"><title id="title">Goal workflow diagram</title><desc id="desc">The goal workflow starts, performs work, audits completion, exits when done, or loops back to work when more progress is needed.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#334155" d="M 0 0 L 10 5 L 0 10 z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="10"/></filter></defs><rect width="1120" height="480" fill="#f8fafc"/><text x="560" y="48" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">Goal Workflow</text><text x="560" y="78" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" text-anchor="middle">Work toward an immutable goal, audit evidence, then exit or continue.</text><g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif"><path fill="#dbeafe" stroke="#2563eb" stroke-width="2" d="M 112 200 L 160 240 L 112 280 L 64 240 Z"/><text x="112" y="246" fill="#1e3a8a" font-size="18" font-weight="700" text-anchor="middle">Start</text><rect width="170" height="144" x="246" y="168" fill="#ecfeff" stroke="#0891b2" stroke-width="2" rx="14"/><text x="331" y="225" fill="#164e63" font-size="22" font-weight="700" text-anchor="middle">Work</text><text x="331" y="252" fill="#155e75" font-size="14" text-anchor="middle">continue.md</text><text x="331" y="276" fill="#155e75" font-size="13" text-anchor="middle">full thread context</text><rect width="210" height="180" x="528" y="150" fill="#fefce8" stroke="#ca8a04" stroke-width="2" rx="14"/><text x="633" y="218" fill="#713f12" font-size="22" font-weight="700" text-anchor="middle">Completion Audit</text><text x="633" y="246" fill="#854d0e" font-size="14" text-anchor="middle">audit.md</text><text x="633" y="270" fill="#854d0e" font-size="13" text-anchor="middle">validated routing JSON</text><path fill="#dcfce7" stroke="#16a34a" stroke-width="2" d="M 914 200 L 962 240 L 914 280 L 866 240 Z"/><text x="914" y="246" fill="#14532d" font-size="18" font-weight="700" text-anchor="middle">Exit</text></g><g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif"><path d="M 161 240 L 236 240"/><path d="M 416 240 L 518 240"/><path d="M 738 240 L 856 240"/><path d="M 633 330 C 633 400 331 400 331 323"/></g><g fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14"><text x="797" y="224" font-weight="700" text-anchor="middle">Done</text><text x="482" y="392" font-weight="700" text-anchor="middle">Continue</text><text x="482" y="414" text-anchor="middle">missing or weak evidence</text></g></svg>